<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>给小小宝的生日手记</title>
  <link rel="stylesheet" href="./style.css?v=8e78b1c166a2">
  <script defer src="./album-data.js?v=107cc27b5170"></script>
  <script defer src="./album.js?v=eb5313d62c94"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M4 12h15m-6.5-6.5L19 12l-6.5 6.5"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M20 12H5m6.5-6.5L5 12l6.5 6.5"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M8 17V6l12-2v11M8 9l12-2"/><ellipse cx="5.5" cy="17.5" rx="2.5" ry="2"/><ellipse cx="17.5" cy="15.5" rx="2.5" ry="2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 5.5c3.2-.9 6.1-.4 9 1.4 2.9-1.8 5.8-2.3 9-1.4v13c-3.2-.8-6.1-.3-9 1.4-2.9-1.7-5.8-2.2-9-1.4zM12 7v12"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></symbol>
    <symbol id="i-seal" viewBox="0 0 40 40"><path d="M20 16c-7-11-14-6-10-1 2 3 6 5 10 9 4-4 8-6 10-9 3-6-4-10-10 1Z" fill="currentColor" stroke="none"/><path d="M20 32c1-4 4-7 8-8M24 28c-.5-3 .6-4.6 2.6-5.8M25 27c2.5.2 5-1.4 5.5-3.1" stroke-width="1.3"/></symbol>
  </svg>
  <div class="wrap">
    <header class="mast">
      <div class="brand"><span class="brand-stamp"><svg class="icon"><use href="#i-seal"/></svg></span><span>给小小宝的生日手记</span></div>
      <nav class="tools" aria-label="相册工具">
        <button id="music-toggle" type="button" class="tool" aria-pressed="true"><svg class="icon"><use href="#i-music"/></svg><span id="music-label">关闭配乐</span></button>
        <button id="contents-open" type="button" class="tool"><svg class="icon"><use href="#i-book"/></svg><span>目录</span></button>
      </nav>
    </header>

    <main id="cover" class="cover">
      <section class="dedication" aria-label="封面">
        <div class="cover-lettering">
          <p id="birthday-date" class="cover-date">2026 · 11 · 18</p>
          <h1><span class="recipient">给小小宝的</span><span class="cover-title">生日手记</span></h1>
        </div>
        <img class="cover-penpen" src="./assets/penpen-birthday.png" alt="蓝白英短喷喷端着小蛋糕，祝姐姐生日快乐" width="510" height="510" decoding="async">
      </section>
      <div class="cover-photo-wrap">
        <figure class="cover-print">
          <img id="cover-photo" decoding="async" fetchpriority="high" width="1500" height="1126" alt="爱丁堡初见时的草地合照">
          <figcaption><span>爱丁堡</span><span id="cover-photo-date"></span></figcaption>
        </figure>
      </div>
      <div class="cover-actions">
        <button id="start" type="button" class="primary"><span id="start-label">翻开相册</span><svg class="icon"><use href="#i-next"/></svg></button>
        <button id="restart" type="button" class="plain" hidden>从第一页开始</button>
      </div>
    </main>

    <main id="reader" class="reader" hidden>
      <div class="reader-top">
        <button id="home" type="button" class="text-button"><svg class="icon"><use href="#i-prev"/></svg>封面</button>
        <span id="page-count" class="folio" aria-live="polite"></span>
      </div>
      <article id="leaf">
        <header class="leaf-heading"><p id="date" class="leaf-date"></p><h2 id="chapter-title" tabindex="-1"></h2></header>
        <figure id="print" class="reader-print">
          <button type="button" id="photo-open" class="photo-open" aria-label="放大查看这张照片">
            <img id="photo" decoding="async" alt="">
            <span class="expand-icon" aria-hidden="true"><svg class="icon"><use href="#i-expand"/></svg></span>
          </button>
          <div id="film" class="film" hidden>
            <video id="clip" controls playsinline webkit-playsinline preload="none" aria-label="回忆录视频"></video>
            <button type="button" id="play-clip" class="play-clip"><span class="play-triangle" aria-hidden="true"></span><span id="play-label">播放视频</span></button>
            <a id="clip-link" class="clip-link" hidden>打开视频文件</a>
          </div>
        </figure>
        <p id="caption" class="caption"></p>
      </article>
      <nav class="pager" aria-label="相册翻页">
        <button id="previous" class="page-button" type="button"><svg class="icon"><use href="#i-prev"/></svg>上一页</button>
        <span class="progress-rail" aria-hidden="true"><span id="progress"></span></span>
        <button id="next" class="page-button" type="button"><span id="next-label">下一页</span><svg class="icon"><use href="#i-next"/></svg></button>
      </nav>
    </main>
  </div>

  <section id="contents" class="overlay contents" role="dialog" aria-modal="true" aria-labelledby="contents-title" hidden>
    <div class="contents-panel"><header><div><h2 id="contents-title">相册目录</h2><span id="contents-count"></span></div><button type="button" id="contents-close" class="close" aria-label="关闭目录"><svg class="icon"><use href="#i-close"/></svg></button></header><nav id="chapter-list" aria-label="按章节翻阅"></nav></div>
  </section>
  <section id="lightbox" class="overlay lightbox" role="dialog" aria-modal="true" aria-label="查看大图" hidden><button class="close" type="button" id="photo-close" aria-label="关闭大图"><svg class="icon"><use href="#i-close"/></svg></button><img id="large-photo" alt=""></section>
  <audio id="music" preload="none" loop></audio>
  <p class="message" id="message" role="status" hidden></p>
  <noscript><p class="message">打开浏览器的 JavaScript 后即可翻阅相册。</p></noscript>
</body>
</html>
